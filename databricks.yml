bundle:
  name: mottainai_bi

# Keep authoring utilities and the retired monolithic notebook in Git/CI,
# but out of the curated Databricks workspace folder.
sync:
  exclude:
    - dashboard/build_dashboard.py
    - archive/legacy/02_refresh_medallion.py

variables:
  operational_connection:
    description: Unity Catalog connection to PostgreSQL MOTTAINAI (preflight only).
    default: conection_motta_operacional
  operational_database:
    default: MOTTAINAI
  analytics_connection:
    description: Unity Catalog connection to PostgreSQL MOTTAINAI_ANALITICO.
    default: motta_analytics
  analytics_database:
    default: MOTTAINAI_ANALITICO
  target_catalog:
    description: Managed Unity Catalog destination for Delta tables.
    default: motta_analytics

workspace:
  # Keep notebooks, dashboard source, and operating docs grouped in the
  # user's MOTTAINAI workspace folder. Bundle deployment state remains in
  # the existing default root so this deployment continues updating job 731348243647869.
  file_path: /Users/ana.costa@institutojef.org.br/MOTTAINAI/BI

resources:
  jobs:
    analytics_to_medallion:
      name: mottainai-analytics-to-medallion
      description: Publish one committed analytical batch through separate Bronze, Silver and Gold tasks, then refresh BI.
      max_concurrent_runs: 1
      parameters:
        - name: operational_connection
          default: ${var.operational_connection}
        - name: operational_database
          default: ${var.operational_database}
        - name: analytics_connection
          default: ${var.analytics_connection}
        - name: analytics_database
          default: ${var.analytics_database}
        - name: target_catalog
          default: ${var.target_catalog}
      tasks:
        - task_key: preflight
          notebook_task:
            notebook_path: ./notebooks/01_preflight.py
        - task_key: bronze
          depends_on:
            - task_key: preflight
          notebook_task:
            notebook_path: ./notebooks/00_bronze_analitico.py
        - task_key: silver
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: ./notebooks/01_silver.py
        - task_key: gold
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ./notebooks/02_gold.py
        - task_key: refresh_dashboard
          depends_on:
            - task_key: gold
          dashboard_task:
            dashboard_id: 01f1d581d40c1272b43d52fd8c18722a
            warehouse_id: 64bc14de5692c645
      schedule:
        quartz_cron_expression: '0 30 2 * * ?'
        timezone_id: America/Sao_Paulo
        pause_status: UNPAUSED
