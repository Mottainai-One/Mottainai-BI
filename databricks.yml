bundle:
  name: mottainai_bi

variables:
  operational_connection:
    description: Unity Catalog connection to PostgreSQL MOTTAINAI (preflight only).
    default: conection_motta_operacional
  operational_database:
    default: MOTTAINAI
  analytics_connection:
    description: Unity Catalog connection to PostgreSQL MOTTAINAI_ANALITICO.
    default: motta_analytics
  analytics_database:
    default: MOTTAINAI_ANALITICO
  target_catalog:
    description: Managed Unity Catalog destination for Delta tables.
    default: workspace

resources:
  jobs:
    analytics_to_medallion:
      name: mottainai-analytics-to-medallion
      description: Read the last committed analytical batch and publish validated Bronze, Silver and Gold snapshots.
      max_concurrent_runs: 1
      parameters:
        - name: operational_connection
          default: ${var.operational_connection}
        - name: operational_database
          default: ${var.operational_database}
        - name: analytics_connection
          default: ${var.analytics_connection}
        - name: analytics_database
          default: ${var.analytics_database}
        - name: target_catalog
          default: ${var.target_catalog}
      tasks:
        - task_key: preflight
          notebook_task:
            notebook_path: ./notebooks/01_preflight.py
        - task_key: bronze
          depends_on:
            - task_key: preflight
          notebook_task:
            notebook_path: ./notebooks/00_bronze_analitico.py
        - task_key: refresh_medallion
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: ./notebooks/02_refresh_medallion.py
        - task_key: refresh_dashboard
          depends_on:
            - task_key: refresh_medallion
          dashboard_task:
            dashboard_id: 01f1d22904b81b738aef457d6a67f354
            warehouse_id: 64bc14de5692c645
      schedule:
        quartz_cron_expression: '0 30 2 * * ?'
        timezone_id: America/Sao_Paulo
        pause_status: UNPAUSED
