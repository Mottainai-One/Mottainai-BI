name: BI configuration

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Databricks notebooks
        run: python -m compileall -q notebooks
      - name: Validate dashboard source and generated definition
        run: |
          python dashboard/build_dashboard.py
          git diff --exit-code -- dashboard/mottainai_bi.lvdash.json
          python - <<'PY'
          import json
          from pathlib import Path

          dashboard = json.loads(Path('dashboard/mottainai_bi.lvdash.json').read_text(encoding='utf-8'))
          datasets = {item['name'] for item in dashboard['datasets']}
          assert len(datasets) == 6
          for item in dashboard['datasets']:
              sql = ' '.join(item['queryLines']).lower()
              assert 'workspace.mottainai_gold.' in sql
              assert 'remote_query(' not in sql
              assert 'mottainai_operacional' not in sql
          canvas = [page for page in dashboard['pages'] if page['pageType'] == 'PAGE_TYPE_CANVAS']
          filters = [page for page in dashboard['pages'] if page['pageType'] == 'PAGE_TYPE_GLOBAL_FILTERS']
          assert len(canvas) == 2 and len(filters) == 1
          widgets = [part['widget'] for page in dashboard['pages'] for part in page['layout']]
          assert {'filter-period', 'filter-store'} <= {widget['name'] for widget in widgets}
          assert {'counter', 'line', 'bar', 'histogram', 'box', 'symbol-map'} <= {
              widget.get('spec', {}).get('widgetType') for widget in widgets
          }
          for widget in widgets:
              for query in widget.get('queries', []):
                  assert query['query']['datasetName'] in datasets
          PY
      - name: Parse and inspect bundle configuration
        run: |
          python -m pip install 'PyYAML==6.0.2'
          python - <<'PY'
          import pathlib
          import yaml

          bundle = yaml.safe_load(pathlib.Path('databricks.yml').read_text(encoding='utf-8'))
          job = bundle['resources']['jobs']['analytics_to_medallion']
          assert job['schedule']['timezone_id'] == 'America/Sao_Paulo'
          assert job['schedule']['pause_status'] == 'UNPAUSED'
          assert [task['task_key'] for task in job['tasks']] == [
              'preflight', 'bronze', 'refresh_medallion', 'refresh_dashboard'
          ]
          assert job['tasks'][1]['depends_on'] == [{'task_key': 'preflight'}]
          assert job['tasks'][2]['depends_on'] == [{'task_key': 'bronze'}]
          assert job['tasks'][3]['depends_on'] == [{'task_key': 'refresh_medallion'}]
          assert job['tasks'][3]['dashboard_task']['dashboard_id']
          assert job['parameters'][2]['name'] == 'analytics_connection'
          for task in job['tasks'][:3]:
              assert pathlib.Path(task['notebook_task']['notebook_path']).exists()
          PY
