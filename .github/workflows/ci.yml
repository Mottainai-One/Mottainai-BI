name: BI configuration

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Databricks notebooks
        run: python -m compileall -q notebooks
      - name: Parse and inspect bundle configuration
        run: |
          python -m pip install 'PyYAML==6.0.2'
          python - <<'PY'
          import pathlib
          import yaml

          bundle = yaml.safe_load(pathlib.Path('databricks.yml').read_text(encoding='utf-8'))
          job = bundle['resources']['jobs']['analytics_to_medallion']
          assert job['schedule']['timezone_id'] == 'America/Sao_Paulo'
          assert job['schedule']['pause_status'] == 'PAUSED'
          assert [task['task_key'] for task in job['tasks']] == [
              'preflight', 'refresh_medallion'
          ]
          for task in job['tasks']:
              assert pathlib.Path(task['notebook_task']['notebook_path']).exists()
          PY
